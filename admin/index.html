<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Parfum With You</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; color: #d4af37; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #333; }
    .card h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 10px; }
    label { font-size: 0.9rem; color: #ccc; }
    input[type="number"] { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 5px; width: 100px; text-align: right; }
    .toggle-btn { background: #444; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .toggle-btn.in-stock { background: #28a745; }
    .toggle-btn.out-stock { background: #dc3545; }
    .save-bar { position: sticky; bottom: 10px; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #d4af37; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-top: 20px; }
    .btn-main { background: #d4af37; color: #000; font-weight: bold; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; }
    #login-box { text-align: center; margin-top: 50px; }
    input[type="password"], input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
  </style>
</head>
<body>

  <!-- Formulario de Login -->
  <div id="login-box" class="card">
    <h2>Acceso Administrador</h2>
    <p style="font-size: 0.85rem; color: #aaa;">Ingresa tu Token de GitHub para administrar los productos</p>
    <input type="password" id="github-token" placeholder="Pega tu Token de GitHub aquí">
    <button class="btn-main" onclick="autenticar()">Ingresar al Panel</button>
  </div>

  <!-- Panel de Control (Oculto al inicio) -->
  <div id="admin-panel" style="display: none;">
    <h1>Gestión de Catálogo</h1>
    <div id="lista-productos">Cargando perfumes...</div>

    <div class="save-bar">
      <button class="btn-main" onclick="guardarCambiosEnGitHub()">Guardar Cambios en la Web</button>
    </div>
  </div>

  <script>
    let productosData = [];
    let shaArchivo = "";
    let GITHUB_TOKEN = localStorage.getItem("gh_token") || "";

    const REPO = "parfumwithyou/parfumwithyou";
    const FILE_PATH = "products.json";

    if(GITHUB_TOKEN) {
      iniciarPanel();
    }

    function autenticar() {
      const inputToken = document.getElementById("github-token").value.trim();
      if(!inputToken) return alert("Por favor ingresa un token válido");
      localStorage.setItem("gh_token", inputToken);
      GITHUB_TOKEN = inputToken;
      iniciarPanel();
    }

    async function iniciarPanel() {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          headers: { Authorization: `token ${GITHUB_TOKEN}` }
        });
        const data = await res.json();
        shaArchivo = data.sha;
        
        // Decodificar contenido UTF-8 correctamente
        const content = decodeURIComponent(escape(atob(data.content)));
        const parsed = JSON.parse(content);
        productosData = parsed.productos || parsed;
        
        renderizarProductos();
      } catch (err) {
        alert("Error al conectar con GitHub. Verifica tu Token.");
        localStorage.removeItem("gh_token");
        location.reload();
      }
    }

    function renderizarProductos() {
      const contenedor = document.getElementById("lista-productos");
      contenedor.innerHTML = "";

      productosData.forEach((p, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h3>${p.nombre} <small style="color:#888;">(${p.marca || ''})</small></h3>
          <div class="row">
            <label>Precio ($):</label>
            <input type="number" value="${p.precio || 0}" onchange="actualizarPrecio(${index}, this.value)">
          </div>
          <div class="row">
            <label>Estado de Stock:</label>
            <button class="toggle-btn ${p.inStock ? 'in-stock' : 'out-stock'}" onclick="toggleStock(${index})">
              ${p.inStock ? 'DISPONIBLE' : 'AGOTADO'}
            </button>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    function actualizarPrecio(index, nuevoPrecio) {
      productosData[index].precio = parseFloat(nuevoPrecio);
    }

    function toggleStock(index) {
      productosData[index].inStock = !productosData[index].inStock;
      renderizarProductos();
    }

    async function guardarCambiosEnGitHub() {
      const boton = document.querySelector(".save-bar .btn-main");
      boton.innerText = "Guardando...";
      boton.disabled = true;

      const nuevoContenido = JSON.stringify({ productos: productosData }, null, 2);
      const contenidoBase64 = btoa(unescape(encodeURIComponent(nuevoContenido)));

      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          method: "PUT",
          headers: {
            Authorization: `token ${GITHUB_TOKEN}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Actualización de stock/precios desde Panel Admin",
            content: contenidoBase64,
            sha: shaArchivo
          })
        });

        if(res.ok) {
          alert("¡Catálogo actualizado con éxito!");
          const data = await res.json();
          shaArchivo = data.content.sha;
        } else {
          alert("Error al guardar los cambios.");
        }
      } catch (err) {
        alert("Error de conexión al guardar.");
      } finally {
        boton.innerText = "Guardar Cambios en la Web";
        boton.disabled = false;
      }
    }
  </script>
</body>
</html>
