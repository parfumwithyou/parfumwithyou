<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Parfum With You</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; padding: 15px; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.4rem; color: #d4af37; margin-bottom: 15px; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #333; }
    .card h3 { margin: 0 0 10px 0; font-size: 1.1rem; color: #fff; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 10px; }
    label { font-size: 0.85rem; color: #aaa; }
    input[type="number"], input[type="text"], input[type="password"], select { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 5px; box-sizing: border-box; width: 100%; }
    input[type="number"] { width: 100px; text-align: right; }
    .toggle-btn { background: #444; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .toggle-btn.in-stock { background: #28a745; }
    .toggle-btn.out-stock { background: #dc3545; }
    .save-bar { position: sticky; bottom: 10px; background: #1e1e1e; padding: 12px; border-radius: 8px; border: 1px solid #d4af37; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.6); margin-top: 20px; z-index: 100; }
    .btn-main { background: #d4af37; color: #000; font-weight: bold; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 10px; }
    .btn-add { background: #28a745; color: #fff; font-weight: bold; border: none; padding: 12px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 15px; font-size: 0.95rem; }
    .btn-danger { background: #dc3545; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    #login-box { text-align: center; margin-top: 50px; }
    /* Modal Form */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
    .modal-content { background: #1e1e1e; padding: 20px; border-radius: 10px; width: 90%; max-width: 450px; border: 1px solid #d4af37; max-height: 90vh; overflow-y: auto; }
    .modal-content label { display: block; margin-top: 10px; text-align: left; }
    .modal-content input, .modal-content select { margin-top: 5px; }
  </style>
</head>
<body>

  <!-- Login con Contraseña Sencilla -->
  <div id="login-box" class="card">
    <h2>Acceso Administrador</h2>
    <p style="font-size: 0.85rem; color: #aaa;">Ingresa tu contraseña para administrar los perfumes</p>
    <input type="password" id="pass-input" placeholder="Escribe tu contraseña aquí">
    <button class="btn-main" onclick="validarAcceso()">Iniciar Sesión</button>
  </div>

  <!-- Panel Principal -->
  <div id="admin-panel" style="display: none;">
    <h1>Gestión de Catálogo</h1>
    
    <button class="btn-add" onclick="abrirModalNuevo()">+ Agregar Nuevo Perfume</button>

    <div id="lista-productos">Cargando catálogo...</div>

    <div class="save-bar">
      <button class="btn-main" onclick="guardarCambiosEnGitHub()">Guardar Cambios en la Web</button>
    </div>
  </div>

  <!-- Modal para Agregar Perfume -->
  <div id="modal-nuevo" class="modal">
    <div class="modal-content">
      <h2 style="color:#d4af37; margin-top:0;">Nuevo Perfume</h2>
      
      <label>Nombre del Perfume:</label>
      <input type="text" id="nuevo-nombre" placeholder="Ej: Club de Nuit Intense">

      <label>Marca:</label>
      <input type="text" id="nuevo-marca" placeholder="Ej: Armaf">

      <label>Categoría:</label>
      <select id="nuevo-categoria">
        <option value="sellados">Sellados</option>
        <option value="decants">Decants</option>
        <option value="giftset">Giftset</option>
      </select>

      <label>Subcategoría:</label>
      <select id="nuevo-subcategoria">
        <option value="arabes">Árabes</option>
        <option value="disenador">Diseñador</option>
      </select>

      <label>Precio ($):</label>
      <input type="number" id="nuevo-precio" placeholder="0">

      <label>Imagen (Nombre del archivo):</label>
      <input type="text" id="nuevo-imagen" placeholder="Ej: club_de_nuit.jpg">

      <div class="row" style="margin-top: 15px;">
        <button class="toggle-btn out-stock" style="width:48%; padding:12px;" onclick="cerrarModalNuevo()">Cancelar</button>
        <button class="btn-main" style="width:48%; margin-top:0;" onclick="agregarProducto()">Añadir</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // CONFIGURACIÓN - CAMBIA ESTOS 2 VALORES:
    // =========================================================
    const ADMIN_PASSWORD = "Penarol1891"; // La clave que ingresarás en tu teléfono
    const GITHUB_TOKEN = "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"; // Pega tu Token de GitHub (ghp_...)
    // =========================================================

    const REPO = "parfumwithyou/parfumwithyou";
    const FILE_PATH = "products.json";

    let productosData = [];
    let shaArchivo = "";

    // Recordar sesión en el dispositivo
    if (localStorage.getItem("admin_logged") === "true") {
      iniciarPanel();
    }

    function validarAcceso() {
      const pass = document.getElementById("pass-input").value;
      if (pass === ADMIN_PASSWORD) {
        localStorage.setItem("admin_logged", "true");
        iniciarPanel();
      } else {
        alert("Contraseña incorrecta");
      }
    }

    async function iniciarPanel() {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          headers: { Authorization: `token ${GITHUB_TOKEN}` }
        });
        const data = await res.json();
        shaArchivo = data.sha;
        
        const content = decodeURIComponent(escape(atob(data.content)));
        const parsed = JSON.parse(content);
        productosData = parsed.productos || parsed;
        
        renderizarProductos();
      } catch (err) {
        alert("Error al conectar con GitHub. Revisa que el TOKEN esté bien pegado en el código.");
      }
    }

    function renderizarProductos() {
      const contenedor = document.getElementById("lista-productos");
      contenedor.innerHTML = "";

      productosData.forEach((p, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>${p.nombre} <small style="color:#888;">(${p.marca || ''})</small></h3>
            <button class="btn-danger" onclick="eliminarProducto(${index})">Eliminar</button>
          </div>
          <div class="row">
            <label>Precio ($):</label>
            <input type="number" value="${p.precio || 0}" onchange="actualizarPrecio(${index}, this.value)">
          </div>
          <div class="row">
            <label>Estado de Stock:</label>
            <button class="toggle-btn ${p.inStock ? 'in-stock' : 'out-stock'}" onclick="toggleStock(${index})">
              ${p.inStock ? 'DISPONIBLE' : 'AGOTADO'}
            </button>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    function actualizarPrecio(index, nuevoPrecio) {
      productosData[index].precio = parseFloat(nuevoPrecio);
    }

    function toggleStock(index) {
      productosData[index].inStock = !productosData[index].inStock;
      renderizarProductos();
    }

    function eliminarProducto(index) {
      if(confirm(`¿Estás seguro de eliminar "${productosData[index].nombre}"?`)) {
        productosData.splice(index, 1);
        renderizarProductos();
      }
    }

    function abrirModalNuevo() {
      document.getElementById("modal-nuevo").style.display = "flex";
    }

    function cerrarModalNuevo() {
      document.getElementById("modal-nuevo").style.display = "none";
    }

    function agregarProducto() {
      const nombre = document.getElementById("nuevo-nombre").value.trim();
      const marca = document.getElementById("nuevo-marca").value.trim();
      const categoria = document.getElementById("nuevo-categoria").value;
      const subcategoria = document.getElementById("nuevo-subcategoria").value;
      const precio = parseFloat(document.getElementById("nuevo-precio").value) || 0;
      const imagen = document.getElementById("nuevo-imagen").value.trim() || "placeholder.jpg";

      if(!nombre) return alert("Escribe el nombre del perfume");

      const nuevoId = productosData.length > 0 ? Math.max(...productosData.map(p => p.id || 0)) + 1 : 1;

      const nuevoItem = {
        id: nuevoId,
        nombre: nombre,
        marca: marca,
        categoria: categoria,
        subcategoria: subcategoria,
        precio: precio,
        inStock: true,
        imagen: imagen
      };

      productosData.unshift(nuevoItem);
      renderizarProductos();
      cerrarModalNuevo();

      // Limpiar campos
      document.getElementById("nuevo-nombre").value = "";
      document.getElementById("nuevo-marca").value = "";
      document.getElementById("nuevo-precio").value = "";
      document.getElementById("nuevo-imagen").value = "";
    }

    async function guardarCambiosEnGitHub() {
      const boton = document.querySelector(".save-bar .btn-main");
      boton.innerText = "Guardando en la web...";
      boton.disabled = true;

      const nuevoContenido = JSON.stringify({ productos: productosData }, null, 2);
      const contenidoBase64 = btoa(unescape(encodeURIComponent(nuevoContenido)));

      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          method: "PUT",
          headers: {
            Authorization: `token ${GITHUB_TOKEN}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Actualización de catálogo desde Panel Admin",
            content: contenidoBase64,
            sha: shaArchivo
          })
        });

        if(res.ok) {
          alert("¡Catálogo actualizado con éxito!");
          const data = await res.json();
          shaArchivo = data.content.sha;
        } else {
          alert("Error al guardar cambios. Verifica el Token.");
        }
      } catch (err) {
        alert("Error de conexión al guardar.");
      } finally {
        boton.innerText = "Guardar Cambios en la Web";
        boton.disabled = false;
      }
    }
  </script>
</body>
</html>
